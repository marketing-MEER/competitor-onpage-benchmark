[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-onpage-benchmark"
version = "1.0.0"
description = "Compare your page with top competitor pages: length, headings, schema, media, links"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "competitor", "onpage", "benchmark"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/competitor-onpage-benchmark"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
competitor-onpage-benchmark = "competitor_onpage_benchmark.cli:main"

[tool.setuptools]
packages = ["competitor_onpage_benchmark"]
